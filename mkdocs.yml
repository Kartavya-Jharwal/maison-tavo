site_name: Maison Tavo
site_description: Maison Tavo kitchenware concept, custom Shopify flagship, Kansa companion and commerce case study.
site_url: https://kartavya-jharwal.github.io/maison-tavo/
repo_url: https://github.com/Kartavya-Jharwal/maison-tavo
repo_name: Kartavya-Jharwal/maison-tavo
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Libre Baskerville
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: brown
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: brown
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Awwwards SOTY 2026 Grand Plan: awwwards-grand-plan.md
  - Maison Tavo explained: maison-tavo.md
  - Agents: agents.md
  - Experience roadmap: experience-roadmap.md
  - Programme register: programme-register.md
  - Delivery plan: delivery-plan.md
  - Design: design.md
  - Architecture: architecture.md
  - Research and proof: research-and-proof.md
  - Current-state audit: project-audit-2026-11-02.md
  - Storefront feature audit: storefront-feature-audit-2026-11-20.md
  - Engagement register: roadmap.md
  - Decisions: decisions.md
  - Getting started: getting-started.md
  - Storefront: storefront.md
  - Catalogue categories: catalogue-categories.md
  - Forge lineup: forge-series.md
  - Development: development.md
  - License: license.md

plugins:
  - search
