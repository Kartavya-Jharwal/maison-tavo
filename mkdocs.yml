site_name: Maison Tavo
site_description: Documentation for the Maison Tavo headless storefront.
site_url: https://kartavya-jharwal.github.io/maison-tavo/
repo_url: https://github.com/Kartavya-Jharwal/maison-tavo
repo_name: Kartavya-Jharwal/maison-tavo
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Libre Baskerville
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: brown
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: brown
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Decisions: decisions.md
  - Getting started: getting-started.md
  - Storefront: storefront.md
  - Development: development.md
  - License: license.md

plugins:
  - search
